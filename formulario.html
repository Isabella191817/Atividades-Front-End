<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <style>
  *{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color:lightblue;
    color:deepskyblue;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  h1{
    color: #f8fafc;
    text-align: center;
    margin-bottom: 5px;
    font-weight: 600;
  }

  .box{
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 520px;
  }

  .box h2 {
    font-size: 1.3rem;
    color:deepskyblue;
    margin-bottom: 15px;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 8px;
  }

  label{
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: 600;
    color:deepskyblue;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input{
    width: 100%;
    padding: 12px;
    border: 1.5px solid #cbd5e1;
    background-color: #f8fafc;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: all 0.2s ease;
  }

  input:focus{
    border-color:deepskyblue;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  .btn-submit{
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background-color:deepskyblue;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-submit:hover {
    background-color:deepskyblue;
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  fieldset {
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 15px;
    background-color: #f8fafc;
  }

  legend {
    font-weight: 600;
    color: #334155;
    padding: 0 8px;
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 4px;
  }

  .search-box {
    display: flex;
    width: 100%;
  }

  .search-box input {
    flex: 1;    
    border-radius: 8px 0 0 8px;
  }

  .btn-search {
    width: auto;
    padding: 0 20px;
    background-color:darkblue;
    color: white;
    border: none;
    border-radius: 0 8px 8px 0;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.2s;
  }

  .btn-search:hover {
    background-color:darkblue;
  }
</style>

<h1>Painel de Cadastros</h1>

<section class="box">
  <h2>Cadastro de Usuário</h2>
  <form action="#" method="POST">
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required placeholder="nome@exemplo.com">

    <label for="senha">Senha:</label>
    <input
      type="password"
      id="senha"
      name="senha"
      required
      pattern="(?=.*\d)(?=.*[a-zA-Z]).{8,}"
      title="A senha deve conter no mínimo 8 caracteres, com pelo menos uma letra e um número."
      placeholder="Mínimo 8 caracteres">

    <button type="submit" class="btn-submit">Cadastrar</button>
  </form>
</section>

<section class="box">
  <h2>Login Responsivo</h2>
  <form class="login-form" action="#" method="POST">
    <div>
      <label for="login-email">E-mail:</label>
      <input type="email" id="login-email" name="email" placeholder="seu@email.com" required>
    </div>
    <div>
      <label for="login-senha">Senha:</label>
      <input type="password" id="login-senha" name="senha" placeholder="Sua senha" required>
    </div>
    <button type="submit" class="btn-submit">Entrar</button>
  </form>
</section>

<section class="box">
  <h2>Dados Pessoais</h2>
  <form action="#" method="POST">
    <fieldset>
      <legend>Identificação</legend>
      <label for="nome-pessoal">Nome:</label>
      <input type="text" id="nome-pessoal" name="nome_pessoal">
     
      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
    </fieldset>

    <fieldset>
      <legend>Localização</legend>
      <label for="rua">Rua:</label>
      <input type="text" id="rua" name="rua">
     
      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade">
    </fieldset>

    <button type="submit" class="btn-submit">Salvar Dados</button>
  </form>
</section>

<section class="box">
  <h2>Pesquisa</h2>
  <form action="#" method="GET">
    <div class="search-box">
      <input type="search" name="q" placeholder="O que você procura?" required>
      <button type="submit" class="btn-search">Buscar</button>
    </div>
  </form>
</section>
</body>
</html>
